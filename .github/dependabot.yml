# Dependabot version and security updates.
#
# One PR per ecosystem for every minor and patch bump; security fixes are
# grouped the same way (`applies-to: security-updates`). Major bumps stay one
# PR each, because each needs its own review (API changes, Node or JDK
# requirements).
#
# The npm packages (domain, Functions, rules-test) moved to booking-be (#299);
# its own dependabot.yml updates them. Dependabot's pub PRs run flutter.yml,
# whose test job reads booking-be through the deploy key: BOOKING_BE_DEPLOY_KEY
# is a Dependabot secret too, not only an Actions secret.
#
# Alerts and security updates themselves are repository settings
# (Settings → Code security), enabled on 2026-10-18.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /app_flutter
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      pub-security:
        applies-to: security-updates
        patterns: ["*"]
