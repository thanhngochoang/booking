# Dependabot version updates. Security alerts/updates are a repository setting
# (Settings → Code security), not configured here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /packages/domain
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /app_flutter/firebase/functions
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /app_flutter/firebase/rules-test
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /services/api
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pub
    directory: /app_flutter
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
