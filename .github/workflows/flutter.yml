name: flutter
on:
  push:
    branches: [flutter-rewrite, develop, main]
  pull_request:
    # Also every file a test reads from outside app_flutter/ (the main spec
    # for screen_codes_test, domain fixtures, the API contract under
    # services/): test/tool/affected checks it.
    paths: ['app_flutter/**', 'design-system/**', 'packages/**', 'services/**', 'docs/superpowers/specs/**', '.github/workflows/flutter.yml']

permissions:
  contents: read
  checks: write          # needed by test-reporter to post annotations

# ──────────────────────────────────────────────────────────────────────
# All top-level jobs (analyze, test, firestore-rules, domain) start
# immediately in parallel.  No sequential prepare stage needed.
# ──────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Static analysis ────────────────────────────────────────────
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Generate code (tokens, freezed, l10n)
        run: |
          dart run tool/gen_tokens.dart
          git diff --exit-code lib/core/theme/tokens.g.dart || (echo "tokens.g.dart is stale: run dart run tool/gen_tokens.dart" && exit 1)
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Stub Firebase options (real file is gitignored)
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART
      - run: flutter analyze

  # ── 2. Detect affected tests (import graph + git diff, ~1 s) ─────
  # app_flutter/tool/affected_test.dart, see docs/testing/affected-tests.md.
  # Push events run everything; when the tool is unsure it answers ALL.
  affected:
    runs-on: ubuntu-latest
    outputs:
      test-scope: ${{ steps.detect.outputs.scope }}
      test-files: ${{ steps.detect.outputs.files }}
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        if: github.event_name == 'pull_request'
        with: { channel: stable, cache: true }
      - name: Detect affected tests
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Repo variable: skip (default) or all when no test is affected.
          AFFECTED_ON_NONE: ${{ vars.AFFECTED_ON_NONE }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scope=ALL" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "🔄 $EVENT event → running ALL tests"
            exit 0
          fi
          # The tool imports dart: libraries only; an empty package config
          # lets it start without `flutter pub get`.
          echo '{"configVersion":2,"packages":[]}' > "$RUNNER_TEMP/no-packages.json"
          dart --packages="$RUNNER_TEMP/no-packages.json" tool/affected_test.dart \
              "$BASE_SHA" --github-output --verbose \
            || { echo "::warning title=Affected tests::detector failed, running ALL tests"
                 echo "scope=ALL" >> "$GITHUB_OUTPUT"; echo "files=" >> "$GITHUB_OUTPUT"; }

  # ── 3. Unit / widget tests — 4 shards in parallel ─────────────────
  test:
    runs-on: ubuntu-latest
    needs: affected
    if: needs.affected.outputs.test-scope != 'NONE'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Generate code
        run: |
          dart run tool/gen_tokens.dart
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Stub Firebase options
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART

      - name: Install junitreport
        run: dart pub global activate junitreport

      - name: Run tests (shard ${{ matrix.shard }}/4)
        env:
          TEST_SCOPE: ${{ needs.affected.outputs.test-scope }}
          TEST_FILES: ${{ needs.affected.outputs.test-files }}
        run: |
          # A failing test must fail this shard (default shell has no pipefail).
          set -o pipefail
          mkdir -p test-results

          if [ "$TEST_SCOPE" = "ALL" ]; then
            echo "🔄 Running ALL tests (shard ${{ matrix.shard }}/4)"
            flutter test \
              --exclude-tags golden \
              --concurrency=4 \
              --total-shards=4 \
              --shard-index=${{ matrix.shard }} \
              --reporter=json \
            | dart pub global run junitreport:tojunit --output test-results/shard-${{ matrix.shard }}.xml
          else
            echo "🎯 Running AFFECTED tests only (shard ${{ matrix.shard }}/4)"
            ALL_FILES=($TEST_FILES)
            TOTAL=${#ALL_FILES[@]}

            SHARD_FILES=()
            for (( i=${{ matrix.shard }}; i<TOTAL; i+=4 )); do
              SHARD_FILES+=("${ALL_FILES[$i]}")
            done

            if [ ${#SHARD_FILES[@]} -eq 0 ]; then
              echo "⏭️ No files for this shard"
              echo '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="shard-${{ matrix.shard }}" tests="0"/></testsuites>' \
                > test-results/shard-${{ matrix.shard }}.xml
            else
              echo "Running ${#SHARD_FILES[@]} test files: ${SHARD_FILES[*]}"
              flutter test \
                --exclude-tags golden \
                --concurrency=4 \
                --reporter=json \
                "${SHARD_FILES[@]}" \
              | dart pub global run junitreport:tojunit --output test-results/shard-${{ matrix.shard }}.xml
            fi
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: app_flutter/test-results/
          retention-days: 14

  # ── 4. Firestore rules tests (parallel with everything) ───────────
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Firestore rules tests (emulator)
        working-directory: app_flutter/firebase/rules-test
        run: npm ci && npm test

  # ── 5. Publish test report ────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'skipped'
    steps:
      - uses: actions/checkout@v5
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          merge-multiple: true
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@v1
        with:
          name: '🧪 Flutter Test Report'
          path: test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

  # ── 6. Domain package (fully independent) ─────────────────────────
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Domain package (pure TypeScript)
        working-directory: packages/domain
        run: npm ci && npm run typecheck && npm run lint && npm test

  # ── 7. Cloud Functions: lint, typecheck, unit tests ───────────────
  # Fast checks only, so a PR cannot merge code that turns the post-merge
  # firebase-deploy.yml job red (it also runs the emulator integration
  # tests, which stay post-merge).
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Cloud Functions (lint, typecheck, unit)
        working-directory: app_flutter/firebase/functions
        run: npm ci && npm run lint && npm run typecheck && npm test
