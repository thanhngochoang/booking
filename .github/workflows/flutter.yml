name: flutter
on:
  push:
    branches: [flutter-rewrite, develop, main]
  # Every pull request, with no paths filter: analyze and report are required checks of develop,
  # and a workflow that never starts leaves them missing, so a PR that changes only other files
  # (a plan, a script) could never merge. The changes job decides instead; a job skipped by its
  # `if:` counts as passed (#324).
  pull_request:

permissions:
  contents: read
  checks: write          # needed by test-reporter to post annotations
  pull-requests: read    # the changes job lists the PR's files

jobs:
  # ── 0. Does this PR touch the app? (one API call, no checkout, a few seconds) ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Also every file a test reads from outside app_flutter/ (test/tool/affected checks it):
          # the tests read only app files and the main spec (screen_codes_test). The Firebase
          # backend and the domain live in booking-be since #299 and are tested there.
          APP_PATHS=('app_flutter/**' 'design-system/**' 'docs/superpowers/specs/**' '.github/workflows/flutter.yml')
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # New and old names, so a file moved out of app_flutter/ still counts.
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)'); then
            echo "::warning title=Changed files::cannot list the PR files; running the app jobs"
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          app=false
          while IFS= read -r f; do
            # Unquoted pattern on purpose: in [[ == ]] * also matches /, so dir/** covers every depth.
            for p in "${APP_PATHS[@]}"; do
              if [[ $f == $p ]]; then app=true; break 2; fi
            done
          done <<< "$files"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          [ "$app" = true ] || echo "::notice title=Changed files::no app file changed; analyze, test and report are skipped (skipped counts as passed)"

  # The app jobs run unless the changes job answered false: if it failed, its output is empty
  # and they still run, so a broken changes job can never turn a required check green.
  analyze:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Generated code (tokens.g.dart, *.freezed.dart, *.g.dart, lib/l10n/*) is committed. This is
      # the one job that regenerates it; the test shards compile the committed files directly.
      - name: Generated code is committed and fresh
        run: |
          dart run tool/gen_tokens.dart
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib test || {
            echo "::error::generated code is stale: run dart run tool/gen_tokens.dart, dart run build_runner build --delete-conflicting-outputs and flutter gen-l10n, then commit"
            exit 1
          }
      - name: Stub Firebase options (real file is gitignored)
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART
      - run: flutter analyze

  # ── 2. Unit / widget tests — 8 shards in parallel ────────────────
  # Each shard detects the affected tests itself (import graph + git diff,
  # ~1 s: app_flutter/tool/affected_test.dart, docs/testing/affected-tests.md);
  # only the few-second changes job sits in front of the shards. Push events
  # run everything; when the tool is unsure it answers ALL. The shards compile
  # the committed generated code (the analyze job checks it is fresh) and write
  # the raw flutter JSON report, which the report job reads directly.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v7
        with:
          # The detector diffs against the PR base; push events need no history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Detect affected tests
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Repo variable: skip (default) or all when no test is affected.
          AFFECTED_ON_NONE: ${{ vars.AFFECTED_ON_NONE }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scope=ALL" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "🔄 $EVENT event → running ALL tests"
            exit 0
          fi
          # The tool imports dart: libraries only; an empty package config
          # lets it start without `flutter pub get`.
          echo '{"configVersion":2,"packages":[]}' > "$RUNNER_TEMP/no-packages.json"
          dart --packages="$RUNNER_TEMP/no-packages.json" tool/affected_test.dart \
              "$BASE_SHA" --github-output --verbose \
            || { echo "::warning title=Affected tests::detector failed, running ALL tests"
                 echo "scope=ALL" >> "$GITHUB_OUTPUT"; echo "files=" >> "$GITHUB_OUTPUT"; }

      - name: No test is affected by this change
        if: steps.detect.outputs.scope == 'NONE'
        run: echo "::notice title=Affected tests::no test reads the changed files; shard ${{ matrix.shard }} skipped (set the repo variable AFFECTED_ON_NONE=all to run everything instead)"

      - run: flutter pub get
        if: steps.detect.outputs.scope != 'NONE'
      - name: Stub Firebase options (real file is gitignored)
        if: steps.detect.outputs.scope != 'NONE'
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART

      - name: Run tests (shard ${{ matrix.shard }}/${{ env.SHARDS }})
        if: steps.detect.outputs.scope != 'NONE'
        env:
          TEST_SCOPE: ${{ steps.detect.outputs.scope }}
          TEST_FILES: ${{ steps.detect.outputs.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          REPORT="test-results/shard-$SHARD.json"

          if [ "$TEST_SCOPE" = "ALL" ]; then
            echo "🔄 Running ALL tests (shard $SHARD/$SHARDS)"
            flutter test \
              --exclude-tags golden \
              --concurrency=4 \
              --total-shards="$SHARDS" \
              --shard-index="$SHARD" \
              --file-reporter "json:$REPORT"
          else
            echo "🎯 Running AFFECTED tests only (shard $SHARD/$SHARDS)"
            ALL_FILES=($TEST_FILES)
            TOTAL=${#ALL_FILES[@]}

            SHARD_FILES=()
            for (( i=SHARD; i<TOTAL; i+=SHARDS )); do
              SHARD_FILES+=("${ALL_FILES[$i]}")
            done

            if [ ${#SHARD_FILES[@]} -eq 0 ]; then
              echo "⏭️ No files for this shard"
            else
              echo "Running ${#SHARD_FILES[@]} test files: ${SHARD_FILES[*]}"
              flutter test \
                --exclude-tags golden \
                --concurrency=4 \
                --file-reporter "json:$REPORT" \
                "${SHARD_FILES[@]}"
            fi
          fi

      - name: Upload test results
        if: always() && steps.detect.outputs.scope != 'NONE'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: app_flutter/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── 3. Publish test report ────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download all shard results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-shard-*
          merge-multiple: true
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@v3
        with:
          name: '🧪 Flutter Test Report'
          path: test-results/**/*.json
          reporter: flutter-json
          # No file when every shard was skipped (no affected test).
          fail-on-empty: false
          fail-on-error: true

