name: flutter
on:
  push:
    branches: [flutter-rewrite, develop, main]
  pull_request:
    # Also every file a test reads from outside app_flutter/ (the main spec
    # for screen_codes_test, domain fixtures): test/tool/affected checks it.
    # The self-hosted API contract is a snapshot inside app_flutter/ (repo booking-be).
    paths: ['app_flutter/**', 'design-system/**', 'packages/**', 'docs/superpowers/specs/**', '.github/workflows/flutter.yml']

permissions:
  contents: read
  checks: write          # needed by test-reporter to post annotations

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Generated code (tokens.g.dart, *.freezed.dart, *.g.dart, lib/l10n/*) is committed. This is
      # the one job that regenerates it; the test shards compile the committed files directly.
      - name: Generated code is committed and fresh
        run: |
          dart run tool/gen_tokens.dart
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- lib test || {
            echo "::error::generated code is stale: run dart run tool/gen_tokens.dart, dart run build_runner build --delete-conflicting-outputs and flutter gen-l10n, then commit"
            exit 1
          }
      - name: Stub Firebase options (real file is gitignored)
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART
      - run: flutter analyze

  # ── 2. Unit / widget tests — 8 shards in parallel ────────────────
  # Each shard detects the affected tests itself (import graph + git diff,
  # ~1 s: app_flutter/tool/affected_test.dart, docs/testing/affected-tests.md),
  # so no job sits in front of the shards. Push events run everything; when
  # the tool is unsure it answers ALL. The shards compile the committed
  # generated code (the analyze job checks it is fresh) and write the raw
  # flutter JSON report, which the report job reads directly.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v5
        with:
          # The detector diffs against the PR base; push events need no history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Detect affected tests
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Repo variable: skip (default) or all when no test is affected.
          AFFECTED_ON_NONE: ${{ vars.AFFECTED_ON_NONE }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scope=ALL" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "🔄 $EVENT event → running ALL tests"
            exit 0
          fi
          # The tool imports dart: libraries only; an empty package config
          # lets it start without `flutter pub get`.
          echo '{"configVersion":2,"packages":[]}' > "$RUNNER_TEMP/no-packages.json"
          dart --packages="$RUNNER_TEMP/no-packages.json" tool/affected_test.dart \
              "$BASE_SHA" --github-output --verbose \
            || { echo "::warning title=Affected tests::detector failed, running ALL tests"
                 echo "scope=ALL" >> "$GITHUB_OUTPUT"; echo "files=" >> "$GITHUB_OUTPUT"; }

      - name: No test is affected by this change
        if: steps.detect.outputs.scope == 'NONE'
        run: echo "::notice title=Affected tests::no test reads the changed files; shard ${{ matrix.shard }} skipped (set the repo variable AFFECTED_ON_NONE=all to run everything instead)"

      - run: flutter pub get
        if: steps.detect.outputs.scope != 'NONE'
      - name: Stub Firebase options (real file is gitignored)
        if: steps.detect.outputs.scope != 'NONE'
        run: |
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(apiKey: 'ci', appId: '1:1:android:1', messagingSenderId: '1', projectId: 'demo-nag');
          }
          DART

      - name: Run tests (shard ${{ matrix.shard }}/${{ env.SHARDS }})
        if: steps.detect.outputs.scope != 'NONE'
        env:
          TEST_SCOPE: ${{ steps.detect.outputs.scope }}
          TEST_FILES: ${{ steps.detect.outputs.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p test-results
          REPORT="test-results/shard-$SHARD.json"

          if [ "$TEST_SCOPE" = "ALL" ]; then
            echo "🔄 Running ALL tests (shard $SHARD/$SHARDS)"
            flutter test \
              --exclude-tags golden \
              --concurrency=4 \
              --total-shards="$SHARDS" \
              --shard-index="$SHARD" \
              --file-reporter "json:$REPORT"
          else
            echo "🎯 Running AFFECTED tests only (shard $SHARD/$SHARDS)"
            ALL_FILES=($TEST_FILES)
            TOTAL=${#ALL_FILES[@]}

            SHARD_FILES=()
            for (( i=SHARD; i<TOTAL; i+=SHARDS )); do
              SHARD_FILES+=("${ALL_FILES[$i]}")
            done

            if [ ${#SHARD_FILES[@]} -eq 0 ]; then
              echo "⏭️ No files for this shard"
            else
              echo "Running ${#SHARD_FILES[@]} test files: ${SHARD_FILES[*]}"
              flutter test \
                --exclude-tags golden \
                --concurrency=4 \
                --file-reporter "json:$REPORT" \
                "${SHARD_FILES[@]}"
            fi
          fi

      - name: Upload test results
        if: always() && steps.detect.outputs.scope != 'NONE'
        uses: actions/upload-artifact@v5
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: app_flutter/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── 3. Firestore rules tests (parallel with everything) ───────────
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Firestore rules tests (emulator)
        working-directory: app_flutter/firebase/rules-test
        run: npm ci && npm test

  # ── 4. Publish test report ────────────────────────────────────────
  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v5
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          merge-multiple: true
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@v1
        with:
          name: '🧪 Flutter Test Report'
          path: test-results/**/*.json
          reporter: flutter-json
          # No file when every shard was skipped (no affected test).
          fail-on-empty: false
          fail-on-error: true

  # ── 5. Domain package (fully independent) ─────────────────────────
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Domain package (pure TypeScript)
        working-directory: packages/domain
        run: npm ci && npm run typecheck && npm run lint && npm test

  # ── 6. Cloud Functions: lint, typecheck, unit tests ───────────────
  # Fast checks only, so a PR cannot merge code that turns the post-merge
  # firebase-deploy.yml job red (it also runs the emulator integration
  # tests, which stay post-merge).
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Cloud Functions (lint, typecheck, unit)
        working-directory: app_flutter/firebase/functions
        run: npm ci && npm run lint && npm run typecheck && npm test
