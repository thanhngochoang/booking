# Generated by `npm run bundle:openapi` from api/openapi.yaml and its fragments. Do not edit.
openapi: 3.0.3
info:
  title: NAG self-hosted API
  version: 0.1.0
  description: |
    Phase 2 of the backend migration (docs/superpowers/specs/data-model/README.md §6), first
    vertical slice: profile, private customer contact, photographer contact channels/numbers
    and get_contact_link. Conventions (README §2): camelCase JSON, ISO-8601 UTC instants,
    integer VND, string enum codes, opaque ids. Every error uses the Error schema; clients
    branch on `code`, never on `message`. Phone numbers appear only in owner-only operations.
    The server builds its routes and validators from this file.
servers:
  - url: http://localhost:8787
    description: docker-compose.yml (local)
security:
  - firebaseIdToken: []
paths:
  /v1/contact-links:
    post:
      operationId: getContactLink
      summary: Use case get_contact_link; one URL when contact is unlocked, logged in contact_access_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactLinkRequest"
      responses:
        "200":
          description: The URL to open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: permission_denied (not the customer) or contact_locked (not unlocked yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream domain change events over Server-Sent Events (SSE)
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/files:
    post:
      operationId: createFile
      summary: Request a presigned URL to upload a file
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/files/{fileId}:
    get:
      operationId: getFile
      summary: Retrieve file record by id
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: File record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFile
      summary: Delete a file record and its storage objects
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: File deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/files/{fileId}/complete:
    post:
      operationId: completeFile
      summary: Complete upload and enqueue processing
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/health:
    get:
      operationId: health
      summary: Liveness and database reachability
      security: []
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me:
    post:
      operationId: ensureProfile
      summary: Create the caller's profile when missing (never overwrites) and record the sign-in identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnsureProfileRequest"
      responses:
        "200":
          description: The existing profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/devices/{installationId}:
    put:
      operationId: registerDevice
      summary: Register or refresh a push device token
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9]{8,40}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "204":
          description: Device registered successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: unregisterDevice
      summary: Unregister a push device token
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9]{8,40}$
      responses:
        "204":
          description: Device unregistered successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/photographers/{photographerId}/contact-channels:
    parameters:
      - $ref: "#/components/parameters/PhotographerId"
    get:
      operationId: getContactChannels
      summary: Public channel flags (no numbers)
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactChannels"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/photographers/{photographerId}/contact-numbers:
    parameters:
      - $ref: "#/components/parameters/PhotographerId"
    get:
      operationId: getContactNumbers
      summary: The photographer's private numbers (owner only; others use getContactLink)
      responses:
        "200":
          description: Numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactNumbers"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/photographers/{photographerId}/contact-setup:
    parameters:
      - $ref: "#/components/parameters/PhotographerId"
    put:
      operationId: completeContactSetup
      summary: S34 "Hoàn tất" in one transaction (area, flags, numbers, onboardingComplete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSetupRequest"
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/photographers/{photographerId}/service-area:
    parameters:
      - $ref: "#/components/parameters/PhotographerId"
    get:
      operationId: getServiceArea
      summary: City and radius (others see it once onboarding is complete)
      responses:
        "200":
          description: Area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceArea"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/staff/approvals:
    get:
      operationId: listStaffApprovals
      summary: Pending two-person requests the caller made or may decide (any staff role)
      description: |
        Pending rows that are the caller's own or of a kind the caller's role may approve, ordered by id (request
        time). `own` and `canDecide` tell what the caller may do; the stored params never leave the server.
      parameters:
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/staff/approvals/{approvalId}/cancel:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: cancelStaffApproval
      summary: Withdraw one's own pending request (the requester only)
      description: Anyone but the requester is 403 `staff_forbidden`; a row no longer pending is 409 `conflict`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffEmpty"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/staff/approvals/{approvalId}/decide:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: decideStaffApproval
      summary: Approve or reject a pending request (the kind's approve action; never the requester)
      description: |
        The requester is 409 `same_person`; a role without the kind's approve action is 403 `staff_forbidden`; a
        row that is no longer pending, or whose operation is running, is 409 `conflict`. Past its expiry the row
        closes as `expired`; an entity that changed since the request closes it as `rejected` (note `stale`).
        Reject needs a 5–500 character `note`. Not one transaction: the claim, the operation and the close each
        commit on their own, so a second caller sees a running operation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideStaffApprovalRequest"
      responses:
        "200":
          description: How the request closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideStaffApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/staff/audit:
    get:
      operationId: listAuditLog
      summary: The audit trail, newest first (audit.view)
      description: |
        At most one scope: `actor`, or `entityType` with `entityId`, or `action` (two scopes are 400). `from` is
        inclusive and `to` exclusive (ISO-8601 instants). Ordered by `at desc, id desc`; `after` is the opaque
        `next` of the previous page. There is no `since`: the audit log is append-only history read by date
        range, not a changes feed, so a client never syncs it. `actorName` comes from Firebase Auth.
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: entityType
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z][a-z_]{0,31}$
        - name: entityId
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_.]{0,63}$
        - name: from
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: to
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/staff/me:
    get:
      operationId: getStaffMe
      summary: The caller's staff role (any staff role)
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/staff/members:
    get:
      operationId: listStaffMembers
      summary: The team (staff.set_role)
      description: |
        Every staff member with name, e-mail and enrolled second factors from Firebase Auth, oldest grant first.
        The team is a handful of rows, so the page is always complete (`next: null`).
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/staff/members/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    patch:
      operationId: setStaffRole
      summary: Grant, change or remove a staff role (staff.set_role)
      description: |
        Writes or deletes the member row with one `staff.set_role` audit row, then revokes the user's sessions.
        The same role again returns `{changed: false}` and writes nothing. Demoting or removing the last admin is
        409 `last_admin`; an unknown user is 404.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStaffRoleRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetStaffRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/staff/members/{uid}/reset-mfa:
    parameters:
      - name: uid
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      operationId: resetStaffMfa
      summary: Remove every second factor of a user (staff.reset_mfa)
      description: One `staff.reset_mfa` audit row, then clears the second factors and revokes the sessions.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffReasonRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffEmpty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/staff/platform/file-urls:
    post:
      operationId: getSensitiveFileUrl
      summary: Resolve a short-lived presigned URL for a sensitive file viewed by staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetSensitiveFileUrlRequest"
      responses:
        "200":
          description: Presigned URL and expiration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSensitiveFileUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/staff/users/find:
    post:
      operationId: findUserForStaff
      summary: Find one account by its exact e-mail (staff.set_role)
      description: |
        A lookup, not a change (no audit row, not idempotent). POST, not GET, so the e-mail stays in the body and
        out of URLs, proxy logs and access logs. `staffRole` comes from `staff_members`. An unknown e-mail is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindUserForStaffRequest"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      summary: Public profile (any signed-in user)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      summary: Change the owner's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/users/{userId}/contact:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUserContact
      summary: The owner's private contact (owner only)
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContact"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveUserContact
      summary: Create or replace the owner's contact; a changed number becomes unverified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveUserContactRequest"
      responses:
        "200":
          description: Stored contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/users/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: setRole
      summary: Use case set_role; the first switch to photographer creates the photographer row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (Auth emulator tokens when AUTH_MODE=firebase-emulator)
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    PhotographerId:
      name: photographerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    PageAfter:
      name: after
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]{1,3}$
    PageSince:
      name: since
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key, per caller, kept 48 hours. A retry with the same key and request replays the
        stored 2xx with header `idempotent-replayed: true` and no second side effect. The same key with
        another operation or body is `invalid_argument`; while the first call still runs it is `conflict`.
        A non-2xx outcome frees the key, so a corrected retry runs.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
  responses:
    BadRequest:
      description: invalid_argument
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: permission_denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: conflict or another state the request cannot enter (e.g. last_admin, same_person)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ApprovalPage:
      description: A `Page` of `ApprovalRow`, ordered by id (request time).
      type: object
      additionalProperties: false
      required:
        - items
        - next
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRow"
        next:
          type: string
          nullable: true
    ApprovalRow:
      description: A pending two-person request. The stored `params` never leave the server.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - entityType
        - entityId
        - amount
        - reason
        - status
        - requestedBy
        - requestedByName
        - requestedRole
        - requestedAt
        - expiresAt
        - own
        - canDecide
      properties:
        id:
